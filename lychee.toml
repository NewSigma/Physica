verbose = "warn"
no_progress = true
include_fragments = "anchor-only"
extensions = [
  "md", "markdown",
  "rst",
  "html",
  "h", "hpp", "hh", "hxx", "inc",
  "c", "cc", "cpp", "cxx",
  "cu", "cuh",
  "py",
  "cmake",
  "txt",
  "in",
  "yml", "yaml",
]
exclude_path = [
  "(^|/)(3rdparty|build|dist|temp)/",
]

max_retries = 3
retry_wait_time = 5
timeout = 30
accept = ["200..=204", "429"]
max_concurrency = 16
host_concurrency = 4
