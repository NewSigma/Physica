# Based on preset-full
name: Build CUDA Preset

on:
  workflow_call:
    inputs:
      build_config:
        required: true
        type: string
        description: 'Debug or Release'

defaults:
  run:
    shell: bash -l {0}

jobs:
  build-cuda:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CCACHE_COMPILERCHECK: content

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1

    - name: Print hardware info
      run: |
        uname -a
        lscpu | grep -E 'Vendor ID|Model name|Flags|Hypervisor'
        echo nproc: `nproc`

    - name: Install ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        key: CUDA-${{ inputs.build_config }}

    - name: Install clang
      uses: egor-tensin/setup-clang@v2.3
      with:
        version: 23
        platform: # optional, default is x64
        cc: # optional, default is 1

    - name: Install conda
      uses: conda-incubator/setup-miniconda@v4.0.1
      with:
        activate-environment: physica
        environment-file: .github/env/cuda.yml
        channels: conda-forge

    - name: Reset ccache statistics
      run: ccache -z

    - name: Configure
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ inputs.build_config }} \
          -DCMAKE_C_COMPILER=clang-23 \
          -DCMAKE_CXX_COMPILER=clang++-23 \
          -DCMAKE_CUDA_COMPILER=clang++-23 \
          -DCMAKE_CUDA_ARCHITECTURES=89 \
          -DCMAKE_LINKER_TYPE=LLD \
          -DCMAKE_PREFIX_PATH=$CONDA_PREFIX \
          -DCMAKE_CXX_FLAGS="-Werror -mrdseed" \
          -DPHYSICA_ARCH=x86-64-v3 \
          -DPHYSICA_CCACHE=ON \
          -DPHYSICA_CUDA=ON \
          -DWarpSize=32 \
          -DFullUnifiedSupport=true \
          -DMemoryPoolsSupported=true \
          -DPHYSICA_HDF5=ON \
          -DPHYSICA_MKL=ON \
          -DPHYSICA_MPI=ON \
          -DPHYSICA_MIMALLOC=ON \
          -DPHYSICA_GUI=ON \
          -DBUILD_EXAMPLES=ON \
          -DBUILD_BENCHMARKS=ON

    - name: Build
      run: |
        cd build
        cmake --build .  --parallel

    - name: Print ccache statistics
      run: |
        ccache -s
        cleanups=$(ccache --print-stats | awk -F'\t' '$1=="cleanups_performed"{print $2}')
        if [ "${cleanups:-0}" -gt 0 ]; then
          echo "::warning::ccache hit its size limit and evicted entries (${cleanups} cleanup(s)); consider raising max-size."
        fi
