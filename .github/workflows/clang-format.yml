name: clang-format

on:
  push:
    branches: [ "Physica", "dev" ]
    paths-ignore:
      - 'doc/**'
      - '*.md'
  pull_request:
    branches: [ "Physica", "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 2

    - name: Install
      run: |
        sudo apt-get install -y clang-format-20

    - name: Run clang-format
      run: |
        git clang-format-20 HEAD^ --diff --binary=`which clang-format-20`
