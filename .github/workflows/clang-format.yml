name: clang-format

on:
  push:
    branches: [ "Physica", "dev" ]
    paths-ignore:
      - 'doc/**'
      - '*.md'
  pull_request:
    branches: [ "Physica", "dev" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 2

    - name: Install conda
      uses: conda-incubator/setup-miniconda@v4.0.1
      with:
        activate-environment: base
        channels: conda-forge

    - name: Install clang-format
      shell: bash -el {0}
      run: |
        conda install -y clang-tools=23.1.1

    - name: Run clang-format
      shell: bash -el {0}
      run: |
        git clang-format HEAD^ --diff --binary="$(which clang-format-23)" --extensions=c,cc,cp,cpp,c++,cxx,h,hh,hpp,hxx,inc,ccm,cppm,cxxm,c++m,cu,cuh
