name: Build-Test Full

on:
  push:
    branches: [ "Physica", "dev" ]
    paths-ignore:
      - 'doc/**'
      - '*.md'
  pull_request:
    branches: [ "Physica", "dev" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    uses: ./.github/workflows/preset.yml
    with:
      preset: full
      build_config: Debug
      test: true
      install: false

  release:
    needs: debug
    uses: ./.github/workflows/preset.yml
    with:
      preset: full
      build_config: Release
      test: true
      install: false
