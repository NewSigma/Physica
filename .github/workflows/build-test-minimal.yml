name: Build-Test Minimal

on:
  push:
    branches: [ "Physica", "dev" ]
    paths-ignore:
      - 'doc/**'
      - '*.md'
  pull_request:
    branches: [ "Physica", "dev" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    strategy:
      fail-fast: false
      matrix:
        preset: [minimal, minimal-libcxx]
    name: debug / ${{ matrix.preset }}
    uses: ./.github/workflows/preset.yml
    with:
      preset: ${{ matrix.preset }}
      features: minimal
      build_config: Debug
      test: true
      install: false

  release:
    needs: debug
    strategy:
      fail-fast: false
      matrix:
        preset: [minimal, minimal-libcxx]
    name: release / ${{ matrix.preset }}
    uses: ./.github/workflows/preset.yml
    with:
      preset: ${{ matrix.preset }}
      features: minimal
      build_config: Release
      test: true
      install: false
