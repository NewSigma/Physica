name: Build-Test Minimal

on:
  push:
    branches: [ "Physica", "dev" ]
    paths-ignore:
      - 'doc/**'
      - '*.md'
  pull_request:
    branches: [ "Physica", "dev" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    uses: ./.github/workflows/preset.yml
    with:
      preset: minimal
      build_config: Debug
      test: true
      install: false

  release:
    needs: debug
    uses: ./.github/workflows/preset.yml
    with:
      preset: minimal
      build_config: Release
      test: true
      install: false
