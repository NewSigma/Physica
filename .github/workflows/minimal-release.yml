name: Build-Test Minimal Release

on:
  push:
    branches: [ "Physica" ]
  pull_request:
    branches: [ "Physica" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install clang
      uses: egor-tensin/setup-clang@v2.3
      with:
        version: 23
        platform: # optional, default is x64
        cc: # optional, default is 1

    - name: Install 
      run: |
        sudo apt-get install libfftw3-dev

    - name: Configure
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang-23 \
          -DCMAKE_CXX_COMPILER=clang++-23 \
          -DCMAKE_LINKER_TYPE=LLD

    - name: Build
      run: |
        cd build
        cmake --build .  --parallel

    - name: Test
      run: |
        cd build/test
        ctest --parallel --output-on-failure --progress .
