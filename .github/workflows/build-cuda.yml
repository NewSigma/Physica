name: Build CUDA

on:
  push:
    branches: [ "Physica", "dev" ]
    paths-ignore:
      - 'doc/**'
      - '*.md'
  pull_request:
    branches: [ "Physica", "dev" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    uses: ./.github/workflows/preset.yml
    with:
      preset: cuda
      features: cuda
      build_config: Debug
      test: false
      install: false

  release:
    needs: debug
    uses: ./.github/workflows/preset.yml
    with:
      preset: cuda
      features: cuda
      build_config: Release
      test: false
      install: false
